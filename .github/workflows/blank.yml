
name: Test, Build and Deploy Quiz

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar JavaScript
        run: node --check script.js

      - name: Verificar arquivos principais
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar arquivos do site
        run: |
          mkdir public
          cp index.html style.css script.js public/
          cp README.md public/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
